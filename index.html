<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="">
        <h1>個人報名Individual Registration</h1>
        <h2><span class="title">基本資料/Basic Information</span></h2>
        <section> <!--基本資料-->

            <div> <!--姓名-->
                <label for="name">姓名/Name<span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="請輸入姓名" required>
            </div>
            <div> <!--性別-->
                <label for="gender">性別/Gender</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">男/male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">女/female</label>
            </div>
            <div> <!--國籍-->
                <label for="nationality">國籍/Nationality</label>
                <input type="radio" name="nationality" id="roc" value="roc">
                <label for="roc">本國國籍/ROC Citizens</label>
                <input type="radio" name="nationality" id="other" value="other">
                <label for="other">外國國籍/Non-Citizens</label>
            </div>
            <div> <!--身分證號-->
                <label for="idnumber">身分證號/ID Number<span class="required">*</span></label>
                <input type="text" name="idnumber" id="idnumber" pattern="[A-Za-z][0-9]{9}" placeholder="身分證號或護照號碼"
                    required>
            </div>

                <select name="bth-month" id="month"> <!--月-->

            </div>
            <div> <!--電子信箱-->
                <label for="mail">電子信箱/Email<span class="required">*</span></label>
                <input type="email" id="mail" name="mail" placeholder="example@mail.com" required>
            </div>
            <div> <!--聯絡電話-->
                <label>聯絡電話/Contact Phone</label>
                <label for="mobile">手機/Mobile</label>
                <input type="tel" id="mobile" name="mobile" pattern="09[0-9]{8}" placeholder="0922053012">
                <label for="home">住家/Home</label>
                <input type="tel" id="home" name="home" pattern="0[0-9]{2,3}[0-9]{6,8}" placeholder="0225855659">
                <label for="office">公司/Office</label>
                <input type="tel" id="office" name="office" pattern="0[0-9]{2,3}[0-9]{6,8}">
            </div>
            <div> <!--通訊地址-->
                <label for="city">通訊地址/Mailing Address</label>
                <select name="city" id="city"> <!--縣市-->
                    <option value="">請選擇縣市別Country/City</option>
                    <option value="台北市">台北市</option>
                    <option value="新北市">新北市</option>
                    <option value="桃園市">桃園市</option>
                </select>
                <select name="township" id="township"> <!--台北區-->
                    <option value="">請選擇鄉鎮區別Township</option>
                    <option value="文山區">文山區</option>
                    <option value="大安區">大安區</option>
                    <option value="信義區">信義區</option>
                    <option value="中山區">中山區</option>
                    <option value="松山區">松山區</option>
                </select>
                <input type="text" id="postcode" name="postcode" pattern="[0-9]{3}" placeholder="郵遞區號">
                <input type="text" id="address" name="address" placeholder="例如：昌吉街55號2樓206室">
            </div>
            <div> <!--緊急聯絡人-->
                <label for="emergency">緊急聯絡人姓名/Name of Emergency Contact</label>
                <input type="text" id="emergency" name="emergency">
                <label for="relationship">關係/Relationship</label>
                <input type="text" id="relationship" name="relationship">
                <label for="emphone">電話/Phone</label>
                <input type="tel" id="emphone" pattern="09[0-9]{8}" name="emphone">
            </div>

        </section>
        <hr>
        <h2><span class="title">競賽項目資料/Race Category Information</span></h2>
        <section> <!--競賽項目資料-->

            <div>
                <input type="checkbox" id="9km" name="9km">
                <label for="9km">9KM（NTD800）</label>
                <select name="9km_shirt" id="9km_shirt">
                    <option value="">請選擇衣服尺寸</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
            </div>
            <div>
                <input type="checkbox" id="3km" name="3km">
                <label for="3km">3KM（NTD650）</label>
                <select name="3km_shirt" id="3km_shirt">
                    <option value="">請選擇衣服尺寸</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
            </div>

        </section>
        <hr>
        <h2><span class="title">報到方式（二擇一）/Check-in Method</span></h2>
        <section> <!--報到方式-->
            <div>
                <label>郵寄代理報到/Postal delivery Check-in</label>
                <input type="radio" id="yes" name="postal" value="yes">
                <label for="yes">是/Y（需額外付費，限台灣本島）</label>
                <input type="radio" id="no" name="postal" value="no">
                <label for="no">否/N</label>
            </div>
            <div>
                <input type="radio" id="to_location" name="to_location" checked>
                <label for="to_location">地點：花博爭豔館（台北市中山區玉門街1號）</label>
                <label>時間：</label>
                <input type="date" value="2026-12-17">
                ~
                <input type="date" value="2026-12-18">
            </div>

        </section>
        <hr>
        <h2><span class="title">其他/Other</span></h2>
        <section> <!--其他-->
            <div><!--個人網站-->
                <label for="website">個人網站/Website（選填）</label>
                <input type="url" id="website" name="website" placeholder="https://">
            </div>
            <div> <!--備註-->
                <label for="note">備註/Note</label>
                <textarea name="note" id="note" cols="50" rows="5" placeholder="如有特殊需求請於此說明"></textarea>
            </div>
            <div> <!--上傳證件照-->
                <label for="photo">上傳證件照/Upload Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

        </section>
        <hr>
        <br>
        <button type="submit" class="btn_submit">送出報名</button>
        <button type="reset" class="btn_reset">清除重填</button>
    </form>
</body>

</html>
