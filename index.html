<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">

    <h1>個人報名Indivdual Registration</h1>
    <h2><span class="title">基本資料/Basic Infomation</span></h2>
    <section> <!--基本資料-->
        <form action="" method="post">
            <div> <!--姓名-->
                <label for="name">姓名/Name<span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="請輸入姓名" required>
            </div>
            <div> <!--性別-->
                <label for="gender">性別/Gender</label>
                <input type="radio" name="gender" name="male" id="male">

                <input type="radio" name="gender" name="female" id="female">

            <div> <!--國籍-->

                <input type="radio" name="nationality" id="other">

            </div>
            <div> <!--身分證號-->
                <label for="idnumber">身分證號/ID Number<span class="required">*</span></label>

            <div> <!--電子信箱-->
                <label for="mail">電子信箱/Email<span class="required">*</span></label>
                <input type="email" id="mail" name="mail" placeholder="example@mail.com" required>
            </div>
            <div> <!--聯絡電話-->
                <label for="phone">聯絡電話/Contact Phone 手機/Mobile</label>
                <input type="phone" id="phone" name="phone" placeholder="0922053012">
                <label for="home">住家/Home</label>
                <input type="phone" id="home" name="home" placeholder="0225855659">
                <label for="office">公司/Office</label>
                <input type="phone" id="office" name="office">
            </div>
            <div> <!--通訊地址-->
                <label for="city">通訊地址/Mailing Address</label>
                <select name="city" id="city"> <!--縣市-->
                    <option>請選擇縣市別Country/City</option>
                    <option>台北市</option>
                    <option>新北市</option>
                    <option>桃園市</option>
                </select>
                <select name="township" id="township"> <!--台北區-->
                    <option>請選擇鄉鎮區別Township</option>
                    <option>文山區</option>

                    <option>中山區</option>

                <label for="postcode">郵遞區號</label>

                <input type="text" id="address2" name="address2" placeholder="例如：昌吉街55號2樓206室" required>
            </div>
            <div> <!--緊急聯絡人-->

    <hr>
    <h2><span class="title">競賽項目資料/Race Category Information</span></h2>
    <section> <!--競賽項目資料-->
        <form action="" method="post">
            <div>
                <input type="checkbox" id="km" name="km">
                <label for="marathon">9KM（NTD800）</label>
                <select>
                    <option>請選擇衣服尺寸</option>
                    <option>XS</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                    <option>2XL</option>
                </select>
            </div>
            <div>
                <input type="checkbox" id="km2" name="km2">
                <label for="marathon">3KM（NTD650）</label>
                <select>
                    <option>請選擇衣服尺寸</option>
                    <option>XS</option>
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                    <option>2XL</option>
                </select>
            </div>
        </form>
    </section>
    <hr>
    <h2><span class="title">報到方式（二擇一）/Check-in Method</span></h2>
    <section> <!--報到方式-->
        <form action="" method="post">
            <div>
                <label for="postal">郵寄代理報到/Postal delivery Check-in</label>
                <input type="radio" id="yes" name="postal">
                <label for="yes">是/Y（需額外付費，限台灣本島）</label>
                <input type="radio" id="no" name="postal">
                <label for="no">否/N</label>
            </div>
            <div>
                <input type="radio" id="to_location" name="to_location">
                <label for="to_location">地點：花博爭豔館（台北市中山區玉門街1號）</label>
                <label for="date">時間：</label>
                <input type="date" value="2026-12-17">
                ~
                <input type="date" value="2026-12-18">
            </div>
        </form>
    </section>
    <hr>
    <h2><span class="title">其他/Other</span></h2>
    <section> <!--其他-->
        <form action="" method="post">
            <div><!--個人網站-->
                <label for="website">個人網站/Website（選填）</label>
                <input type="url" id="website" name="website" placeholder="https://">
            </div>
            <div> <!--備註-->
                <label for="note">備註/Note</label>
                <textarea name="note" id="note" cols="50" rows="5" placeholder="如有特殊需求請於此說明"></textarea>
            </div>
            <div> <!--上傳證件照-->
                <label for="photo">上傳證件照/Upload Photo</label>
                <input type="file" id="photo" name="photo" accept="image/jpg, image/png">
            </div>
        </form>
    </section>
    <hr>
</body>
<footer>
    <form action="">
        <br>
        <button type="submit" class="btn_submit">送出報名</button>
        <button type="reset" class="btn_reset">清除重填</button>
    </form>
</footer>

</html>
